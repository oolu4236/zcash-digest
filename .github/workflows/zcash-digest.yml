              content_paras = [p for p in paras
                               if 'Never miss a digest' not in p
                               and '<img' not in p
                               and 'accuracy matters' not in p
                               and 'Tip the digest' not in p
                               and 'notification bell' not in p]
              for i, p in enumerate(content_paras):
                  link_count = len(re.findall(r'<a\s+href', p))
                  clean = re.sub(r'<[^>]+>', '', p)
                  if link_count < 2:
                      issues.append(f"P{i+1} has {link_count} links (need 2+)")
                  if len(clean) > 600:
                      issues.append(f"P{i+1} is {len(clean)} chars (max 600)")
              return issues

