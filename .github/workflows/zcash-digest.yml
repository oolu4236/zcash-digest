                      content_png = render_timeline_strip(
                          vdata.get("title", "Timeline"), vdata["events"])
                      content_trigger = "TIMELINE_STRIP"
                      chart_description = vdata.get("title", "Timeline")
                      print(f"  Content visual: TIMELINE_STRIP")

                  elif vtype == "comparison" and vdata.get("a") and vdata.get("b"):
                      content_png = render_comparison_card(
                          vdata.get("title", "Comparison"), vdata["a"], vdata["b"])
                      content_trigger = "COMPARISON_CARD"
                      chart_description = vdata.get("title", "Comparison")
                      print(f"  Content visual: COMPARISON_CARD")

                  else:
                      # Fallback: snapshot card with CoinGecko data
                      try:
                          cg_price = fetch_coingecko(1)
                          p = cg_price["prices"][-1][1]
                          p24 = cg_price["prices"][0][1]
                          pct = ((p - p24) / p24) * 100
                          snap_metrics = [
                              {"icon": "Z", "label": "ZEC", "value": f"${p:,.0f}",
                               "change": f"{abs(pct):.1f}%", "change_dir": "up" if pct >= 0 else "down"},
                          ]
                          content_png = render_snapshot_card(today, snap_metrics)
                          content_trigger = "SNAPSHOT_CARD"
                          chart_description = "Daily snapshot"
                          print(f"  Content visual: SNAPSHOT_CARD (fallback)")
                      except Exception as snap_err:
                          print(f"  Snapshot card failed: {snap_err}")

                  if content_png:
                      fname = f"{today_iso}-{content_trigger.lower()}.png"
                      chart_url = commit_chart_to_ghpages(content_png, fname)
                      chart_trigger = content_trigger
                      print(f"  Content visual committed: {chart_url}")

              except Exception as cv_err:
                  print(f"Content visual error (non-fatal): {cv_err}")

          # ── Insert chart image if generated ─────────────────────
          if chart_url:
              chart_alt = chart_description or "Zcash Daily chart"
              img_tag = f'<p><img src="{chart_url}" alt="{chart_alt}" style="max-width:100%;border-radius:8px;"></p><br>'
              # Insert before CTA if present, otherwise append
              if "accuracy matters to us" in summary:
                  summary = summary.replace(
                      '<p><em>\u2696\ufe0f We put care',
                      f'{img_tag}<p><em>\u2696\ufe0f We put care'
                  )
                  print(f"Chart image inserted before CTA ✓")
              else:
                  summary = summary.rstrip() + "<br>\n" + img_tag
                  print(f"Chart image appended ✓")

          # ── Ensure CTA is always present ─────────────────────────
          CTA_HTML = (
              "<p><em>⚖️ We put care into every digest and accuracy matters to us. "
              "If something doesn't look right, reply and flag it. "
              "Your corrections keep The Zcash Daily reliable.</em></p>"
              "<p>🔔 Hit the notification bell so you never miss an update.</p>"
              "<p>Follow us on X: <a href='https://x.com/thezcashdaily'>"
              "@thezcashdaily</a> #Zcash</p>"
              "<p><strong>Tip the digest (shielded):</strong><br>"
              "<code>u1ugdhhhag775002dh5yx58mw6nlvr9k2zd2lqg8nvtudgxxmntwtavkp3ushc04t0ejynf0j6rt9h4xgcumwve4dkgkq6rlcju5vcq8g2"
              "</code></p>"
          )
          if "accuracy matters to us" not in summary:
              summary = summary.rstrip() + "<br>\n\n" + CTA_HTML
              print("CTA was missing — appended ✓")
          else:
              print("CTA present ✓")

          # ── Post to Notion ──────────────────────────────────────
          card_title = f"The Zcash Daily - {today}"
          notion_page_id = None

          # Convert HTML to Notion blocks
          def html_to_notion_blocks(html):
              """Convert digest HTML to Notion block children."""
              blocks = []
              # Extract paragraphs
              paragraphs = re.findall(r'<p>(.*?)</p>', html, re.DOTALL)
              for p in paragraphs:
                  # Handle image paragraphs → Notion image block
                  img_match = re.search(r'<img\s+src=["\']([^"\']+)["\']', p)
                  if img_match:
                      blocks.append({
                          "object": "block",
                          "type": "image",
                          "image": {
                              "type": "external",
                              "external": {"url": img_match.group(1)},
                          },
                      })
                      continue

                  # Convert <a href="...">text</a> to Notion rich text with links
                  rich_text = []
                  pos = 0
                  for m in re.finditer(r'<a\s+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', p):
                      # Text before link
                      before = re.sub(r'<[^>]+>', '', p[pos:m.start()])
                      if before:
                          rich_text.append({"type": "text", "text": {"content": before}})
                      # Link
                      link_text = re.sub(r'<[^>]+>', '', m.group(2))
                      rich_text.append({
                          "type": "text",
                          "text": {"content": link_text, "link": {"url": m.group(1)}},
                          "annotations": {"bold": False, "italic": False, "underline": True},
                      })
                      pos = m.end()
                  # Remaining text after last link
                  after = re.sub(r'<[^>]+>', '', p[pos:])
                  if after:
                      rich_text.append({"type": "text", "text": {"content": after}})
                  if rich_text:
                      blocks.append({
                          "object": "block",
                          "type": "paragraph",
                          "paragraph": {"rich_text": rich_text},
                      })
              return blocks

          # Extract title from h3 if present
          h3_match = re.search(r'<h3>(.*?)</h3>', summary)
          page_title = re.sub(r'<[^>]+>', '', h3_match.group(1)) if h3_match else card_title

          blocks = html_to_notion_blocks(summary)

          notion_payload = json.dumps({
              "parent": {"page_id": NOTION_PAGE_ID},
              "properties": {
                  "title": [{"text": {"content": page_title}}],
              },
              "children": blocks,
          }).encode()

          try:
              with urllib.request.urlopen(urllib.request.Request(
                  "https://api.notion.com/v1/pages",
                  data=notion_payload,
                  headers={
                      "Authorization": f"Bearer {NOTION_TOKEN}",
                      "Content-Type": "application/json",
                      "Notion-Version": "2022-06-28",
                  },
                  method="POST",
              )) as res:
                  result = json.loads(res.read())
                  notion_page_id = result.get("id")
                  print(f"Notion page created: {notion_page_id}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Notion error ({e.code}): {body}")

          # ── Post to Twitter/X ──────────────────────────────────
          tweet_id = None
          skip_tweet = os.environ.get("SKIP_TWEET", "").lower() in ("true", "1", "yes")
          if TWITTER_API_KEY and TWITTER_ACCESS_TOKEN and not skip_tweet:
              print("Generating tweet...")
              forum_url = "https://forum.zcashcommunity.com/t/the-zcash-daily/57219"
              tweet_prompt = (
                  f"Condense this HTML digest into tweet text (max 200 chars — URL and CTA are added separately). "
                  f"Write it as a voiced, human take — not a bullet-point summary. "
                  f"Use \\n\\n (double newline) between distinct thoughts so Twitter renders line breaks. "
                  f"Tag people and orgs mentioned (e.g. @matthuang, @ElectricCoinCo, @ZcashFoundation). "
                  f"Include #Zcash hashtag. Sharp and editorial. "
                  f"Do NOT include any URL or CTA in your output — just the voiced text with tags and hashtag. "
                  f"CRITICAL: The output MUST contain literal newline characters (\\n\\n) between paragraphs, not spaces.\n\n{summary}"
              )
              tweet_payload = json.dumps({
                  "model": "claude-haiku-4-5-20251001",
                  "max_tokens": 300,
                  "messages": [{"role": "user", "content": tweet_prompt}],
              }).encode()
              tweet_req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=tweet_payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(tweet_req) as res:
                  tweet_data = json.loads(res.read())
              tweet_text = tweet_data["content"][0]["text"].strip()
              cta = "Read more 👇"
              tail = f"\n\n{cta}\n{forum_url}"
              max_text = 280 - len(tail)
              if len(tweet_text) > max_text:
                  tweet_text = tweet_text[:max_text - 3] + "..."
              tweet_text = f"{tweet_text}{tail}"
              print(f"Tweet ({len(tweet_text)} chars): {tweet_text}")

              # OAuth 1.0a signature
              def oauth_sign(method, url, params):
                  base = "&".join([
                      method.upper(),
                      urllib.parse.quote(url, safe=""),
                      urllib.parse.quote("&".join(
                          f"{urllib.parse.quote(k, safe='')}={urllib.parse.quote(v, safe='')}"
                          for k, v in sorted(params.items())
                      ), safe=""),
                  ])
                  key = (
                      f"{urllib.parse.quote(TWITTER_API_SECRET, safe='')}"
                      f"&{urllib.parse.quote(TWITTER_ACCESS_SECRET, safe='')}"
                  )
                  return base64.b64encode(
                      hmac.new(key.encode(), base.encode(), hashlib.sha1).digest()
                  ).decode()

              tw_url = "https://api.x.com/2/tweets"
              oauth_params = {
                  "oauth_consumer_key": TWITTER_API_KEY,
                  "oauth_nonce": sec.token_hex(16),
                  "oauth_signature_method": "HMAC-SHA1",
                  "oauth_timestamp": str(int(time.time())),
                  "oauth_token": TWITTER_ACCESS_TOKEN,
                  "oauth_version": "1.0",
              }
              oauth_params["oauth_signature"] = oauth_sign("POST", tw_url, oauth_params)
              auth_header = "OAuth " + ", ".join(
                  f'{urllib.parse.quote(k, safe="")}="{urllib.parse.quote(v, safe="")}"'
                  for k, v in sorted(oauth_params.items())
              )

              tw_payload = json.dumps({"text": tweet_text}).encode()
              tw_req = urllib.request.Request(
                  tw_url,
                  data=tw_payload,
                  headers={
                      "Authorization": auth_header,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(tw_req) as res:
                      tw_result = json.loads(res.read())
                      tweet_id = tw_result['data']['id']
                      print(f"Tweet posted: {tweet_id}")
              except urllib.error.HTTPError as e:
                  print(f"Twitter error {e.code}: {e.read().decode()}")
          else:
              print("Twitter credentials not set, skipping tweet.")

          # ── Update log.json ────────────────────────────────────
          print("Updating log.json...")
          gh_api = "https://api.github.com"
          gh_headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          log_sha = None
          log_entries = []
          try:
              req = urllib.request.Request(
                  f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                  headers=gh_headers,
              )
              with urllib.request.urlopen(req) as res:
                  file_data = json.loads(res.read())
                  log_sha = file_data["sha"]
                  log_entries = json.loads(base64.b64decode(file_data["content"]))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              print("  log.json not found - will create it.")

          # Before appending, remove same-day duplicates
          log_entries = [e for e in log_entries if e.get("date") != today_iso]

          log_entry = {
              "date": today_iso,
              "title": card_title,
              "content": summary,
              "notion_page_id": notion_page_id,
              "tweet_id": tweet_id,
          }
          if chart_url:
              log_entry["chart_url"] = chart_url
              log_entry["chart_trigger"] = chart_trigger
          log_entries.append(log_entry)

          put_body = {
              "message": f"digest: {today_iso}",
              "content": base64.b64encode(
                  json.dumps(log_entries, indent=2).encode()
              ).decode(),
              "branch": LOG_BRANCH,
          }
          if log_sha:
              put_body["sha"] = log_sha

          urllib.request.urlopen(urllib.request.Request(
              f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}",
              data=json.dumps(put_body).encode(),
              headers=gh_headers,
              method="PUT",
          ))
          print(f"log.json updated ({len(log_entries)} entries).")

          print("Done.")
          PYEOF
