name: Zcash Daily Digest -> Miro

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      custom_content:
        description: 'Optional: paste custom HTML digest content to skip auto-generation'
        required: false
        type: string

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum and summarize and post to Miro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
          MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_CONTENT: ${{ inputs.custom_content }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, os, textwrap, base64
          from datetime import datetime, timezone, date

          ANTHROPIC_API_KEY     = os.environ["ANTHROPIC_API_KEY"]
          MIRO_TOKEN            = os.environ["MIRO_TOKEN"]
          MIRO_BOARD_ID         = os.environ["MIRO_BOARD_ID"]
          GITHUB_TOKEN          = os.environ["GITHUB_TOKEN"]
          TWITTER_API_KEY       = os.environ.get("TWITTER_API_KEY", "")
          TWITTER_API_SECRET    = os.environ.get("TWITTER_API_SECRET", "")
          TWITTER_ACCESS_TOKEN  = os.environ.get("TWITTER_ACCESS_TOKEN", "")
          TWITTER_ACCESS_SECRET = os.environ.get("TWITTER_ACCESS_SECRET", "")
          FRAME_ID   = "3458764675294246557"
          EPOCH      = date(2026, 6, 10)
          CARD_WIDTH = 600
          CARD_STEP  = 80
          START_Y    = 200
          REPO       = "oolu4236/zcash-digest"
          LOG_PATH   = "log.json"
          LOG_BRANCH = "gh-pages"

          today     = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")
          today_iso = date.today().isoformat()

          # --- Generate or use custom digest ---
          custom = os.environ.get("CUSTOM_CONTENT", "").strip()
          if custom:
              summary = custom
              print("Using custom content.")
          else:
              # Fetch last digest to avoid repetition
              print("Fetching last digest for context...")
              last_digest = ""
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                      headers={
                          "Authorization": f"Bearer {GITHUB_TOKEN}",
                          "Accept": "application/vnd.github+json",
                      },
                  )
                  with urllib.request.urlopen(req) as res:
                      file_data = json.loads(res.read())
                      entries = json.loads(base64.b64decode(file_data["content"]))
                      if entries:
                          last_digest = entries[-1].get("content", "")
                          print(f"  Last digest: {entries[-1].get('date', '?')}")
              except Exception as e:
                  print(f"  Could not fetch last digest: {e}")

              # Determine day theme
              weekday = datetime.now(timezone.utc).strftime("%A")
              if weekday == "Monday":
                  day_theme = (
                      "THEME: Weekend recap. Cover Friday through Monday. "
                      "Broader lens — what shifted over the weekend?"
                  )
              elif weekday == "Wednesday":
                  day_theme = (
                      "THEME: Builder spotlight. Pick ONE grant application, tool, or project "
                      "and go deeper on it — why it matters, what's interesting, what questions it raises. "
                      "Do not list multiple projects surface-level."
                  )
              elif weekday == "Friday":
                  day_theme = (
                      "THEME: The week's undercurrent. What is the thing nobody is talking about "
                      "but should be? Step back from the headlines and surface something deeper — "
                      "a pattern, a tension, a question the community is avoiding."
                  )
              else:
                  day_theme = (
                      "THEME: Open. Cover what's genuinely new and interesting. "
                      "If nothing meaningful happened in the last 24 hours, say so in one honest paragraph "
                      "and explore a single question or observation instead. "
                      "A short, thoughtful post beats a long empty one."
                  )

              print(f"Fetching Zcash forum ({weekday})...")
              prompt = (
                  f"Today is {today}. "
                  f"\n\n{day_theme}"
                  f"\n\nSOURCES — search broadly, not just the forum: "
                  f"1) forum.zcashcommunity.com for new threads and replies. "
                  f"2) GitHub activity across Zcash repos (zcash, librustzcash, zebra, orchard) — new PRs, merged code, releases. "
                  f"3) Crypto news coverage about Zcash — media articles, regulatory developments. "
                  f"4) X/Twitter posts from core Zcash contributors and developers. "
                  f"5) On-chain signals — shielded pool percentage, transaction volume, hashrate shifts. "
                  f"\n\nNO REPETITION — here is the last digest that was published. "
                  f"Do NOT repeat any thread, topic, stat, or framing from it. "
                  f"If a story was covered before, only mention it if there is a genuinely NEW development "
                  f"(a new milestone, vote result, surprising reply, deadline change). "
                  f"If you cannot find enough fresh material, write a shorter digest — 2-3 paragraphs is fine. "
                  f"Do NOT pad with old stories to fill space."
                  f"\n\n<last_digest>\n{last_digest}\n</last_digest>"
                  f"\n\nVOICE: You are writing as a person thinking out loud — not a news anchor, not an LLM summary. "
                  f"Write like someone way-finding through the Zcash ecosystem publicly — curious, honest, willing to say 'I don't know'. "
                  f"Surface things people might not be paying attention to. Ask real questions. Have a take, even if tentative. "
                  f"COMMUNITY VOICES: If you find a forum reply that's sharp or surprising, quote the person directly. "
                  f"Surface the human, not just the thread. People engage when they see themselves reflected. "
                  f"COMMENTARY OVER COVERAGE: On slow days, explore one question honestly rather than listing headlines. "
                  f"e.g. 'Why does the NU7 vote matter if no ZIP makes it binding?' — that's the content that gets shared. "
                  f"\n\nFORMAT: flowing paragraphs, no rigid sections. "
                  f"Each paragraph focuses on one thread or theme, with titles hyperlinked naturally. "
                  f"Use emoticons sparingly where they add warmth (🛡️ 🗳️ 📣). "
                  f"Keep it tight — 3-5 short paragraphs max. No filler, no hedging, no preamble. "
                  f"Do NOT start with 'Based on search results' or any meta-commentary. Jump straight into the HTML. "
                  f"\n\nHTML structure with <br> between paragraphs: "
                  f"<h3>🛡️ The Zcash Daily — {today}</h3><br> "
                  f"[paragraphs in <p> tags separated by <br>] "
                  f"End with: <br><p><em>📣 We're experimenting with the voice and format of this digest — what's landing? What's not? "
                  f"Reply here or tell us on X: <a href='https://x.com/thezcashdaily'>@thezcashdaily</a></em></p> "
                  f"\n\nReturn ONLY the HTML. No markdown, no code fences."
              )

              messages = [{"role": "user", "content": prompt}]
              tools = [{"type": "web_search_20250305", "name": "web_search"}]
              summary = ""

              for attempt in range(6):
                  print(f"  Claude turn {attempt + 1}...")
                  payload = json.dumps({
                      "model": "claude-sonnet-4-6",
                      "max_tokens": 4000,
                      "tools": tools,
                      "messages": messages,
                  }).encode()
                  req = urllib.request.Request(
                      "https://api.anthropic.com/v1/messages",
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "x-api-key": ANTHROPIC_API_KEY,
                          "anthropic-version": "2023-06-01",
                          "anthropic-beta": "web-search-2025-03-05",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req) as res:
                          data = json.loads(res.read())
                  except urllib.error.HTTPError as api_err:
                      print(f"Claude API error {api_err.code}: {api_err.read().decode()}")
                      raise
                  messages.append({"role": "assistant", "content": data["content"]})
                  if data["stop_reason"] == "end_turn":
                      summary = " ".join(
                          b["text"] for b in data["content"] if b["type"] == "text"
                      ).strip()
                      break
                  if data["stop_reason"] == "tool_use":
                      messages.append({"role": "user", "content": [
                          {"type": "tool_result", "tool_use_id": b["id"], "content": b.get("output", "")}
                          for b in data["content"] if b["type"] == "tool_use"
                      ]})

          if not summary:
              raise Exception("No summary from Claude.")
          print("Summary ready.")

          # --- Verify all links ---
          import re
          print("Verifying links...")
          urls = re.findall(r'href=["\']([^"\']+)["\']', summary)
          broken = []
          for url in urls:
              if url.startswith("mailto:") or url.startswith("#"):
                  continue
              try:
                  check_req = urllib.request.Request(url, method="HEAD")
                  check_req.add_header("User-Agent", "Mozilla/5.0 (compatible; ZcashDigestBot/1.0)")
                  with urllib.request.urlopen(check_req, timeout=10) as resp:
                      if resp.status >= 400:
                          broken.append((url, resp.status))
                      else:
                          print(f"  ✓ {url}")
              except urllib.error.HTTPError as e:
                  # Try GET if HEAD is rejected (some servers don't support HEAD)
                  if e.code == 405:
                      try:
                          get_req = urllib.request.Request(url, method="GET")
                          get_req.add_header("User-Agent", "Mozilla/5.0 (compatible; ZcashDigestBot/1.0)")
                          with urllib.request.urlopen(get_req, timeout=10) as resp:
                              if resp.status >= 400:
                                  broken.append((url, resp.status))
                              else:
                                  print(f"  ✓ {url} (GET fallback)")
                      except Exception as e2:
                          broken.append((url, str(e2)))
                  else:
                      broken.append((url, e.code))
              except Exception as e:
                  broken.append((url, str(e)))

          if broken:
              print(f"⚠️  Found {len(broken)} broken link(s):")
              for url, status in broken:
                  print(f"  ✗ {url} -> {status}")
              # Strip broken links from summary — keep the anchor text but remove the href
              for url, _ in broken:
                  # Replace <a href="broken_url">text</a> with just text
                  summary = re.sub(
                      rf'<a\s+href=["\']' + re.escape(url) + r'["\'][^>]*>(.*?)</a>',
                      r'\1',
                      summary,
                  )
              print("Broken links stripped from digest (text preserved).")
          else:
              print(f"All {len(urls)} links verified ✓")

          # --- Post to Miro ---
          days_offset   = (date.today() - EPOCH).days
          next_y        = START_Y + days_offset * CARD_STEP
          needed_height = next_y + 150

          print(f"Day {days_offset} -> y={next_y}, frame height={needed_height}")

          patch = json.dumps({"geometry": {"height": needed_height}}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/frames/{FRAME_ID}",
                  data=patch,
                  headers={
                      "Authorization": f"Bearer {MIRO_TOKEN}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="PATCH",
              ))
              print("Frame fitted.")
          except urllib.error.HTTPError as e:
              print(f"Frame resize failed ({e.code}) — continuing without resize.")

          card_title = f"The Zcash Daily - {today}"
          card_payload = json.dumps({
              "data": {"title": card_title, "description": summary},
              "geometry": {"width": CARD_WIDTH},
              "position": {"x": 400, "y": next_y, "origin": "center"},
              "parent": {"id": FRAME_ID},
          }).encode()

          miro_card_id = None
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/cards",
                  data=card_payload,
                  headers={
                      "Authorization": f"Bearer {MIRO_TOKEN}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )) as res:
                  result = json.loads(res.read())
                  miro_card_id = result.get("id")
                  print(f"Card posted: {miro_card_id}")
          except urllib.error.HTTPError as e:
              print(f"Miro error {e.code}: {e.read().decode()}")
              raise

          # --- Update log.json ---
          print("Updating log.json...")
          gh_api = "https://api.github.com"
          gh_headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          log_sha = None
          log_entries = []
          try:
              req = urllib.request.Request(
                  f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                  headers=gh_headers,
              )
              with urllib.request.urlopen(req) as res:
                  file_data = json.loads(res.read())
                  log_sha = file_data["sha"]
                  log_entries = json.loads(base64.b64decode(file_data["content"]))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              print("  log.json not found - will create it.")

          log_entries.append({
              "date": today_iso,
              "title": card_title,
              "content": summary,
              "miro_card_id": miro_card_id,
          })

          put_body = {
              "message": f"digest: {today_iso}",
              "content": base64.b64encode(
                  json.dumps(log_entries, indent=2).encode()
              ).decode(),
              "branch": LOG_BRANCH,
          }
          if log_sha:
              put_body["sha"] = log_sha

          urllib.request.urlopen(urllib.request.Request(
              f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}",
              data=json.dumps(put_body).encode(),
              headers=gh_headers,
              method="PUT",
          ))
          print(f"log.json updated ({len(log_entries)} entries).")

          # --- Post to Twitter/X ---
          if TWITTER_API_KEY and TWITTER_ACCESS_TOKEN:
              import hashlib, hmac, time, urllib.parse, secrets as sec

              print("Generating tweet...")
              tweet_prompt = (
                  f"Condense this HTML digest into a single tweet (max 280 chars). "
                  f"Format: one-line hook, then 2-3 bullet points using • as bullet, "
                  f"end with the forum thread URL for the top story. "
                  f"No hashtags except #Zcash. No emojis. Sharp and editorial.\n\n{summary}"
              )
              tweet_payload = json.dumps({
                  "model": "claude-haiku-4-5-20251001",
                  "max_tokens": 300,
                  "messages": [{"role": "user", "content": tweet_prompt}],
              }).encode()
              tweet_req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=tweet_payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(tweet_req) as res:
                  tweet_data = json.loads(res.read())
              tweet_text = tweet_data["content"][0]["text"].strip()
              if len(tweet_text) > 280:
                  tweet_text = tweet_text[:277] + "..."
              print(f"Tweet ({len(tweet_text)} chars): {tweet_text}")

              # OAuth 1.0a signature
              def oauth_sign(method, url, params):
                  base = "&".join([
                      method.upper(),
                      urllib.parse.quote(url, safe=""),
                      urllib.parse.quote("&".join(
                          f"{urllib.parse.quote(k, safe='')}={urllib.parse.quote(v, safe='')}"
                          for k, v in sorted(params.items())
                      ), safe=""),
                  ])
                  key = (
                      f"{urllib.parse.quote(TWITTER_API_SECRET, safe='')}"
                      f"&{urllib.parse.quote(TWITTER_ACCESS_SECRET, safe='')}"
                  )
                  sig = base64.b64encode(
                      hmac.new(key.encode(), base.encode(), hashlib.sha1).digest()
                  ).decode()
                  return sig

              tw_url = "https://api.x.com/2/tweets"
              oauth_params = {
                  "oauth_consumer_key": TWITTER_API_KEY,
                  "oauth_nonce": sec.token_hex(16),
                  "oauth_signature_method": "HMAC-SHA1",
                  "oauth_timestamp": str(int(time.time())),
                  "oauth_token": TWITTER_ACCESS_TOKEN,
                  "oauth_version": "1.0",
              }
              oauth_params["oauth_signature"] = oauth_sign("POST", tw_url, oauth_params)
              auth_header = "OAuth " + ", ".join(
                  f'{urllib.parse.quote(k, safe="")}="{urllib.parse.quote(v, safe="")}"'
                  for k, v in sorted(oauth_params.items())
              )

              tw_payload = json.dumps({"text": tweet_text}).encode()
              tw_req = urllib.request.Request(
                  tw_url,
                  data=tw_payload,
                  headers={
                      "Authorization": auth_header,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(tw_req) as res:
                      tw_result = json.loads(res.read())
                      print(f"Tweet posted: {tw_result['data']['id']}")
              except urllib.error.HTTPError as e:
                  print(f"Twitter error {e.code}: {e.read().decode()}")
          else:
              print("Twitter credentials not set, skipping tweet.")

          print("Done.")
          PYEOF
