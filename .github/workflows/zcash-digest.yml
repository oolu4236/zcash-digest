name: Zcash Daily Digest -> Notion

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      custom_content:
        description: 'Optional: paste custom HTML digest content to skip auto-generation'
        required: false
        type: string
      skip_tweet:
        description: 'Skip posting to Twitter/X'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum and summarize and post to Notion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_CONTENT: ${{ inputs.custom_content }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SKIP_TWEET: ${{ inputs.skip_tweet }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "matplotlib", "Pillow"])

          import urllib.request, urllib.error, json, os, re, base64
          import hashlib, hmac, time, urllib.parse, secrets as sec
          from datetime import datetime, timezone, date, timedelta
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont
          import textwrap

          # ── Config ─────────────────────────────────────────────
          ANTHROPIC_API_KEY     = os.environ["ANTHROPIC_API_KEY"]
          NOTION_TOKEN          = os.environ["NOTION_TOKEN"]
          NOTION_PAGE_ID        = os.environ["NOTION_PAGE_ID"]
          GITHUB_TOKEN          = os.environ["GITHUB_TOKEN"]
          TWITTER_API_KEY       = os.environ.get("TWITTER_API_KEY", "")
          TWITTER_API_SECRET    = os.environ.get("TWITTER_API_SECRET", "")
          TWITTER_ACCESS_TOKEN  = os.environ.get("TWITTER_ACCESS_TOKEN", "")
          TWITTER_ACCESS_SECRET = os.environ.get("TWITTER_ACCESS_SECRET", "")

          REPO       = "oolu4236/zcash-digest"
          LOG_PATH   = "log.json"
          LOG_BRANCH = "gh-pages"

          today     = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")
          today_iso = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          weekday_now = datetime.now(timezone.utc).strftime("%A")

          # ── Visual trigger system ─────────────────────────────
          CHART_COLORS = {
              "gold": "#F4B728", "bg": "#0F0F0F", "surface": "#181818",
              "text": "#E8E8E0", "muted": "#555550", "green": "#4ADE80", "red": "#F87171",
          }
          chart_url = None
          chart_trigger = None
          chart_description = ""
          chart_data_summary = ""
          chart_png_bytes = None

          def fetch_coingecko(days=30):
              """Fetch ZEC price and volume from CoinGecko (free, no key)."""
              url = f"https://api.coingecko.com/api/v3/coins/zcash/market_chart?vs_currency=usd&days={days}"
              req = urllib.request.Request(url, headers={"User-Agent": "ZcashDigestBot/1.0"})
              with urllib.request.urlopen(req, timeout=15) as res:
                  return json.loads(res.read())

          def fetch_shielded_pool():
              """Fetch shielded pool stats from Blockchair."""
              url = "https://api.blockchair.com/zcash/stats"
              req = urllib.request.Request(url, headers={"User-Agent": "ZcashDigestBot/1.0"})
              with urllib.request.urlopen(req, timeout=15) as res:
                  data = json.loads(res.read())
                  return data.get("data", {})

          def style_chart(fig, ax):
              """Apply Zcash Daily dark theme to a chart."""
              fig.patch.set_facecolor(CHART_COLORS["bg"])
              ax.set_facecolor(CHART_COLORS["surface"])
              ax.tick_params(colors=CHART_COLORS["text"], labelsize=8)
              ax.spines["top"].set_visible(False)
              ax.spines["right"].set_visible(False)
              ax.spines["bottom"].set_color(CHART_COLORS["muted"])
              ax.spines["left"].set_color(CHART_COLORS["muted"])
              ax.xaxis.label.set_color(CHART_COLORS["text"])
              ax.yaxis.label.set_color(CHART_COLORS["text"])
              ax.title.set_color(CHART_COLORS["text"])
              # Watermark
              fig.text(0.95, 0.02, "The Zcash Daily", fontsize=7,
                       color=CHART_COLORS["muted"], ha="right", alpha=0.6)

          def chart_price_volume_7d(cg_data):
              """7-day price + volume combo chart."""
              prices = cg_data["prices"][-168:]  # ~7 days of hourly data
              volumes = cg_data["total_volumes"][-168:]
              dates = [datetime.fromtimestamp(p[0]/1000, tz=timezone.utc) for p in prices]
              price_vals = [p[1] for p in prices]
              vol_vals = [v[1] for v in volumes]

              fig, ax1 = plt.subplots(figsize=(8, 4), dpi=100)
              style_chart(fig, ax1)

              # Volume bars (background)
              ax2 = ax1.twinx()
              ax2.bar(dates, vol_vals, width=0.03, color=CHART_COLORS["muted"], alpha=0.3, label="Volume")
              ax2.set_ylabel("Volume (USD)", fontsize=8, color=CHART_COLORS["muted"])
              ax2.tick_params(colors=CHART_COLORS["muted"], labelsize=7)
              ax2.spines["right"].set_color(CHART_COLORS["muted"])
              ax2.spines["top"].set_visible(False)

              # Price line (foreground)
              ax1.plot(dates, price_vals, color=CHART_COLORS["gold"], linewidth=2, zorder=5)
              ax1.fill_between(dates, price_vals, alpha=0.1, color=CHART_COLORS["gold"], zorder=4)
              ax1.set_ylabel("ZEC/USD", fontsize=9, color=CHART_COLORS["gold"])
              ax1.set_title(f"ZEC 7-Day Price & Volume", fontsize=11, pad=10)
              ax1.xaxis.set_major_formatter(mdates.DateFormatter("%b %d"))
              ax1.grid(axis="y", color=CHART_COLORS["muted"], alpha=0.2, linewidth=0.5)
              # Auto-scale price axis with padding
              price_min, price_max = min(price_vals), max(price_vals)
              padding = (price_max - price_min) * 0.1 or 10
              ax1.set_ylim(price_min - padding, price_max + padding)

              fig.tight_layout()
              buf = BytesIO()
              fig.savefig(buf, format="png", facecolor=fig.get_facecolor(), bbox_inches="tight")
              plt.close(fig)
              return buf.getvalue()

          def chart_price_shielded_7d(cg_data, shielded_pct):
              """7-day price + shielded pool % dual-axis chart."""
              prices = cg_data["prices"][-168:]
              dates = [datetime.fromtimestamp(p[0]/1000, tz=timezone.utc) for p in prices]
              price_vals = [p[1] for p in prices]

              fig, ax1 = plt.subplots(figsize=(8, 4), dpi=100)
              style_chart(fig, ax1)

              ax1.plot(dates, price_vals, color=CHART_COLORS["gold"], linewidth=2)
              ax1.set_ylabel("ZEC/USD", fontsize=9, color=CHART_COLORS["gold"])
              ax1.set_title("ZEC Price & Shielded Pool (7 days)", fontsize=11, pad=10)
              ax1.xaxis.set_major_formatter(mdates.DateFormatter("%b %d"))
              ax1.grid(axis="y", color=CHART_COLORS["muted"], alpha=0.2, linewidth=0.5)

              # Shielded pool % as horizontal reference line
              ax2 = ax1.twinx()
              ax2.axhline(y=shielded_pct, color=CHART_COLORS["green"], linewidth=1.5,
                          linestyle="--", label=f"Shielded: {shielded_pct:.1f}%")
              ax2.set_ylabel("Shielded Pool %", fontsize=9, color=CHART_COLORS["green"])
              ax2.set_ylim(max(0, shielded_pct - 10), min(100, shielded_pct + 10))
              ax2.tick_params(colors=CHART_COLORS["green"], labelsize=7)
              ax2.spines["right"].set_color(CHART_COLORS["green"])
              ax2.spines["top"].set_visible(False)
              ax2.legend(loc="upper right", fontsize=8, facecolor=CHART_COLORS["surface"],
                         edgecolor=CHART_COLORS["muted"], labelcolor=CHART_COLORS["text"])

              fig.tight_layout()
              buf = BytesIO()
              fig.savefig(buf, format="png", facecolor=fig.get_facecolor(), bbox_inches="tight")
              plt.close(fig)
              return buf.getvalue()

          def chart_shielded_30d(cg_data, shielded_pct, milestone):
              """30-day price with shielded milestone marker."""
              prices = cg_data["prices"]
              dates = [datetime.fromtimestamp(p[0]/1000, tz=timezone.utc) for p in prices]
              price_vals = [p[1] for p in prices]

              fig, ax1 = plt.subplots(figsize=(8, 4), dpi=100)
              style_chart(fig, ax1)

              ax1.plot(dates, price_vals, color=CHART_COLORS["gold"], linewidth=2)
              ax1.set_ylabel("ZEC/USD", fontsize=9, color=CHART_COLORS["gold"])
              ax1.set_title(f"ZEC 30-Day Price — Shielded Pool Hit {milestone}%", fontsize=11, pad=10)
              ax1.xaxis.set_major_formatter(mdates.DateFormatter("%b %d"))
              ax1.grid(axis="y", color=CHART_COLORS["muted"], alpha=0.2, linewidth=0.5)

              # Milestone annotation
              ax1.annotate(f"🛡️ {milestone}% shielded", xy=(dates[-1], price_vals[-1]),
                           fontsize=9, color=CHART_COLORS["green"],
                           bbox=dict(boxstyle="round,pad=0.3", facecolor=CHART_COLORS["surface"],
                                     edgecolor=CHART_COLORS["green"], alpha=0.8))

              fig.tight_layout()
              buf = BytesIO()
              fig.savefig(buf, format="png", facecolor=fig.get_facecolor(), bbox_inches="tight")
              plt.close(fig)
              return buf.getvalue()

          def commit_chart_to_ghpages(png_bytes, filename):
              """Commit a chart PNG to gh-pages charts/ directory, return public URL."""
              gh_api = "https://api.github.com"
              path = f"charts/{filename}"
              gh_headers = {
                  "Authorization": f"Bearer {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              }
              # Check if file exists (to get sha for update)
              file_sha = None
              try:
                  req = urllib.request.Request(
                      f"{gh_api}/repos/{REPO}/contents/{path}?ref={LOG_BRANCH}",
                      headers=gh_headers,
                  )
                  with urllib.request.urlopen(req) as res:
                      file_sha = json.loads(res.read()).get("sha")
              except urllib.error.HTTPError:
                  pass  # File doesn't exist yet

              put_body = {
                  "message": f"chart: {filename}",
                  "content": base64.b64encode(png_bytes).decode(),
                  "branch": LOG_BRANCH,
              }
              if file_sha:
                  put_body["sha"] = file_sha

              urllib.request.urlopen(urllib.request.Request(
                  f"{gh_api}/repos/{REPO}/contents/{path}",
                  data=json.dumps(put_body).encode(),
                  headers=gh_headers,
                  method="PUT",
              ))
              return f"https://oolu4236.github.io/zcash-digest/{path}"

          # ── Content visual renderers (Pillow) ────────────────
          def hex_to_rgb(h):
              h = h.lstrip("#")
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          def get_font(size, bold=False):
              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold
                  else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/System/Library/Fonts/Helvetica.ttc",
              ]
              for p in paths:
                  if os.path.exists(p):
                      try:
                          return ImageFont.truetype(p, size)
                      except Exception:
                          continue
              return ImageFont.load_default()

          def add_watermark(draw, w, h):
              draw.text((w - 130, h - 22), "The Zcash Daily",
                        fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(11))

          def render_snapshot_card(date_str, metrics):
              W, H = 800, 420
              img = Image.new("RGB", (W, H), hex_to_rgb(CHART_COLORS["bg"]))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle((30, 20, W-30, H-20), 16,
                  fill=hex_to_rgb(CHART_COLORS["surface"]), outline=hex_to_rgb("#2A2A2A"))
              draw.text((60, 40), "The Zcash Daily",
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(22, True))
              draw.text((60, 70), date_str,
                  fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(16))
              draw.line((60, 100, W-60, 100), fill=hex_to_rgb("#2A2A2A"), width=1)
              y = 120
              for m in metrics:
                  draw.text((60, y+8), m.get("icon", ""),
                      fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(18))
                  draw.text((90, y+8), m["label"],
                      fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(14))
                  draw.text((250, y), m["value"],
                      fill=hex_to_rgb(CHART_COLORS["text"]), font=get_font(28, True))
                  if "change" in m:
                      c = CHART_COLORS["green"] if m.get("change_dir") == "up" else CHART_COLORS["red"]
                      arrow = "+" if m.get("change_dir") == "up" else "-"
                      draw.text((500, y+8), f"{arrow}{m['change']}",
                          fill=hex_to_rgb(c), font=get_font(14))
                  y += 60
              add_watermark(draw, W, H)
              draw.text((60, H-50), "@thezcashdaily",
                  fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(12))
              buf = BytesIO()
              img.save(buf, format="PNG")
              return buf.getvalue()

          def render_quote_card(quote_text, author, source="Zcash Forum"):
              W, H = 800, 500
              img = Image.new("RGB", (W, H), hex_to_rgb(CHART_COLORS["bg"]))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle((30, 20, W-30, H-20), 16,
                  fill=hex_to_rgb(CHART_COLORS["surface"]), outline=hex_to_rgb("#2A2A2A"))
              draw.rectangle((30, 20, 38, H-20), fill=hex_to_rgb(CHART_COLORS["gold"]))
              draw.text((60, 40), "\u201C",
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(72, True))
              wrapped = textwrap.fill(quote_text, width=38)
              y = 110
              for line in wrapped.split("\n")[:6]:
                  draw.text((80, y), line,
                      fill=hex_to_rgb(CHART_COLORS["text"]), font=get_font(22))
                  y += 34
              y += 20
              draw.text((80, y), f"-- @{author}",
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(16, True))
              draw.text((80, y+26), source,
                  fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(13))
              add_watermark(draw, W, H)
              buf = BytesIO()
              img.save(buf, format="PNG")
              return buf.getvalue()

          def render_governance_flow(title, steps, key_numbers=None):
              W, H = 800, 450
              img = Image.new("RGB", (W, H), hex_to_rgb(CHART_COLORS["bg"]))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle((30, 20, W-30, H-20), 16,
                  fill=hex_to_rgb(CHART_COLORS["surface"]), outline=hex_to_rgb("#2A2A2A"))
              draw.text((60, 40), title,
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(20, True))
              n = len(steps)
              step_w = min(140, (W - 120) // max(n, 1) - 20)
              total_w = n * (step_w + 20) - 20
              start_x = (W - total_w) // 2
              y = 100
              sf = get_font(14, True)
              for i, step in enumerate(steps):
                  x = start_x + i * (step_w + 20)
                  draw.rounded_rectangle((x, y, x+step_w, y+50), 8,
                      fill=hex_to_rgb("#1E1E1E"), outline=hex_to_rgb(CHART_COLORS["gold"]))
                  tw = draw.textlength(step, font=sf)
                  draw.text((x + (step_w - tw)/2, y+16), step,
                      fill=hex_to_rgb(CHART_COLORS["text"]), font=sf)
                  if i < n - 1:
                      ax = x + step_w + 4
                      ay = y + 25
                      draw.line((ax, ay, ax+12, ay), fill=hex_to_rgb(CHART_COLORS["gold"]), width=2)
                      draw.polygon([(ax+12, ay-4), (ax+18, ay), (ax+12, ay+4)],
                          fill=hex_to_rgb(CHART_COLORS["gold"]))
              if key_numbers:
                  ky = 190
                  draw.line((60, ky, W-60, ky), fill=hex_to_rgb("#2A2A2A"), width=1)
                  ky += 20
                  items = list(key_numbers.items())
                  col_w = (W - 120) // max(len(items), 1)
                  for i, (label, value) in enumerate(items):
                      kx = 60 + i * col_w
                      draw.text((kx, ky), label,
                          fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(13))
                      draw.text((kx, ky+22), str(value),
                          fill=hex_to_rgb(CHART_COLORS["text"]), font=get_font(24, True))
              add_watermark(draw, W, H)
              buf = BytesIO()
              img.save(buf, format="PNG")
              return buf.getvalue()

          def render_timeline_strip(title, events):
              W, H = 800, 350
              img = Image.new("RGB", (W, H), hex_to_rgb(CHART_COLORS["bg"]))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle((30, 20, W-30, H-20), 16,
                  fill=hex_to_rgb(CHART_COLORS["surface"]), outline=hex_to_rgb("#2A2A2A"))
              draw.text((60, 40), title,
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(20, True))
              n = max(len(events), 2)
              mx = 80
              ly = 140
              le = W - mx
              draw.line((mx, ly, le, ly), fill=hex_to_rgb(CHART_COLORS["gold"]), width=2)
              draw.polygon([(le, ly-6), (le+10, ly), (le, ly+6)],
                  fill=hex_to_rgb(CHART_COLORS["gold"]))
              spacing = (le - mx) / max(n - 1, 1)
              for i, ev in enumerate(events):
                  x = int(mx + i * spacing)
                  draw.ellipse((x-6, ly-6, x+6, ly+6), fill=hex_to_rgb(CHART_COLORS["gold"]))
                  draw.text((x-20, ly-30), ev["date"],
                      fill=hex_to_rgb(CHART_COLORS["text"]), font=get_font(12, True))
                  label = ev["label"][:16]
                  draw.text((x-25, ly+16), label,
                      fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(11))
              add_watermark(draw, W, H)
              buf = BytesIO()
              img.save(buf, format="PNG")
              return buf.getvalue()

          def render_comparison_card(title, a, b):
              W, H = 800, 450
              img = Image.new("RGB", (W, H), hex_to_rgb(CHART_COLORS["bg"]))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle((30, 20, W-30, H-20), 16,
                  fill=hex_to_rgb(CHART_COLORS["surface"]), outline=hex_to_rgb("#2A2A2A"))
              draw.text((60, 40), title,
                  fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(20, True))
              draw.text((W//2-10, 85), "vs",
                  fill=hex_to_rgb(CHART_COLORS["muted"]), font=get_font(16, True))
              col_w, col_h = 310, 280
              for data, cx in [(a, 60), (b, W-60-col_w)]:
                  cy = 110
                  draw.rounded_rectangle((cx, cy, cx+col_w, cy+col_h), 10,
                      fill=hex_to_rgb("#1E1E1E"), outline=hex_to_rgb("#2A2A2A"))
                  draw.text((cx+20, cy+15), data["name"],
                      fill=hex_to_rgb(CHART_COLORS["gold"]), font=get_font(16, True))
                  draw.line((cx+20, cy+45, cx+col_w-20, cy+45),
                      fill=hex_to_rgb("#2A2A2A"), width=1)
                  py = cy + 60
                  for pt in data.get("points", [])[:5]:
                      for line in textwrap.fill(pt, width=30).split("\n"):
                          draw.text((cx+25, py), f"  {line}",
                              fill=hex_to_rgb(CHART_COLORS["text"]), font=get_font(13))
                          py += 20
                      py += 8
              add_watermark(draw, W, H)
              buf = BytesIO()
              img.save(buf, format="PNG")
              return buf.getvalue()

          # ── Evaluate chart triggers ──────────────────────────
          custom = os.environ.get("CUSTOM_CONTENT", "").strip()
          if not custom:
              try:
                  print("Fetching chart data...")
                  cg_data = fetch_coingecko(30)
                  prices_7d = cg_data["prices"][-168:]  # last 7 days

                  # Calculate 24h price change
                  if len(prices_7d) >= 24:
                      price_now = prices_7d[-1][1]
                      price_24h_ago = prices_7d[-24][1]
                      pct_change_24h = ((price_now - price_24h_ago) / price_24h_ago) * 100
                  else:
                      pct_change_24h = 0

                  # Fetch shielded pool data
                  shielded_pct = None
                  try:
                      bc_stats = fetch_shielded_pool()
                      # Blockchair returns absolute values; calculate percentage
                      shielded_val = bc_stats.get("blockchain_size", 0)  # fallback
                      # Try to get shielded percentage from available fields
                      if "cg_shielded_pool_percentage" in bc_stats:
                          shielded_pct = float(bc_stats["cg_shielded_pool_percentage"])
                      print(f"  Shielded pool: {shielded_pct}%" if shielded_pct else "  Shielded pool data unavailable")
                  except Exception as sp_err:
                      print(f"  Shielded pool fetch failed: {sp_err}")

                  print(f"  ZEC price: ${prices_7d[-1][1]:.2f}, 24h change: {pct_change_24h:+.1f}%")

                  # Trigger priority evaluation
                  if weekday_now == "Tuesday":
                      chart_trigger = "TUESDAY_ALWAYS"
                      chart_description = "7-day ZEC price and volume chart"
                      chart_data_summary = f"ZEC at ${price_now:.0f}, 24h change {pct_change_24h:+.1f}%"
                      chart_png_bytes = chart_price_volume_7d(cg_data)
                      print(f"  Chart trigger: TUESDAY_ALWAYS")

                  elif abs(pct_change_24h) >= 5:
                      chart_trigger = "PRICE_MOVE_5PCT"
                      chart_description = f"7-day ZEC price chart showing {pct_change_24h:+.1f}% move"
                      chart_data_summary = f"ZEC moved {pct_change_24h:+.1f}% in 24h to ${price_now:.0f}"
                      chart_png_bytes = chart_price_volume_7d(cg_data)
                      print(f"  Chart trigger: PRICE_MOVE_5PCT ({pct_change_24h:+.1f}%)")

                  elif weekday_now == "Monday" and shielded_pct is not None:
                      chart_trigger = "MONDAY_WEEKLY_TREND"
                      chart_description = "7-day ZEC price and shielded pool chart"
                      chart_data_summary = f"ZEC at ${price_now:.0f}, shielded pool at {shielded_pct:.1f}%"
                      chart_png_bytes = chart_price_shielded_7d(cg_data, shielded_pct)
                      print(f"  Chart trigger: MONDAY_WEEKLY_TREND")

                  elif weekday_now == "Monday":
                      # Monday without shielded data — fall back to price+volume
                      chart_trigger = "MONDAY_WEEKLY_TREND"
                      chart_description = "7-day ZEC price and volume chart"
