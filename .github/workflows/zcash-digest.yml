name: Zcash Daily Digest → Miro

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum & summarize & post to Miro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
          MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, os
          from datetime import datetime, timezone, date

          ANTHROPIC_API_KEY = os.environ["ANTHROPIC_API_KEY"]
          MIRO_TOKEN        = os.environ["MIRO_TOKEN"]
          MIRO_BOARD_ID     = os.environ["MIRO_BOARD_ID"]
          FRAME_ID          = "3458764675294246557"
          EPOCH             = date(2026, 6, 10)
          CARD_WIDTH        = 600
          CARD_STEP         = 80    # compact — matches visual card height + small gap
          START_Y           = 200   # below the frame header

          today = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")

          # ── Step 1: Fetch Zcash forum via Claude web search ──
          print("Fetching Zcash forum...")
          prompt = f"""Today is {today}.

Search the Zcash community forum (forum.zcashcommunity.com) for active discussions in the last 24 hours.

Write a concise TL;DR digest as HTML:

<p><strong>📅 {today}</strong></p>
<p><strong>🔥 TOP THREADS</strong></p>
<ul>
  <li>[thread title]: [1-2 sentence summary]</li>
  <li>[thread title]: [1-2 sentence summary]</li>
</ul>
<p><strong>💬 COMMUNITY PULSE</strong></p>
<ul>
  <li>[1-2 sentences on overall mood/focus]</li>
</ul>
<p><strong>🔍 WORTH WATCHING</strong></p>
<ul>
  <li>[thread title] — [why it matters]</li>
</ul>

Return only the HTML. No markdown, no code fences."""

          messages = [{"role": "user", "content": prompt}]
          tools    = [{"type": "web_search_20250305", "name": "web_search"}]
          summary  = ""

          for attempt in range(6):
              print(f"  Claude turn {attempt + 1}...")
              payload = json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 2000,
                  "tools": tools,
                  "messages": messages
              }).encode()
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                      "anthropic-beta": "web-search-2025-03-05",
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req) as res:
                  data = json.loads(res.read())
              messages.append({"role": "assistant", "content": data["content"]})
              if data["stop_reason"] == "end_turn":
                  summary = " ".join(b["text"] for b in data["content"] if b["type"] == "text").strip()
                  break
              if data["stop_reason"] == "tool_use":
                  messages.append({"role": "user", "content": [
                      {"type": "tool_result", "tool_use_id": b["id"], "content": b.get("output", "")}
                      for b in data["content"] if b["type"] == "tool_use"
                  ]})

          if not summary:
              raise Exception("No summary from Claude.")
          print("Summary ready.")

          # ── Step 2: Calculate compact card position ──
          days_offset   = (date.today() - EPOCH).days
          next_y        = START_Y + days_offset * CARD_STEP
          needed_height = next_y + 150   # just enough room for this card

          print(f"Day {days_offset} → y={next_y}, frame height={needed_height}")

          # Patch frame to exactly fit today's card (no excess)
          patch = json.dumps({"geometry": {"height": needed_height}}).encode()
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/frames/{FRAME_ID}",
              data=patch,
              headers={"Authorization": f"Bearer {MIRO_TOKEN}",
                       "Content-Type": "application/json",
                       "Accept": "application/json"},
              method="PATCH"
          ))
          print("Frame fitted.")

          # ── Step 3: Post card ──
          card_payload = json.dumps({
              "data": {"title": f"Zcash Daily Digest — {today}", "description": summary},
              "geometry": {"width": CARD_WIDTH},
              "position": {"x": 400, "y": next_y, "origin": "center"},
              "parent": {"id": FRAME_ID}
          }).encode()

          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/cards",
                  data=card_payload,
                  headers={"Authorization": f"Bearer {MIRO_TOKEN}",
                           "Content-Type": "application/json",
                           "Accept": "application/json"},
                  method="POST"
              )) as res:
                  result = json.loads(res.read())
                  print(f"✓ Card posted: {result.get('id')}")
          except urllib.error.HTTPError as e:
              print(f"Miro error {e.code}: {e.read().decode()}")
              raise

          print("Done.")
          PYEOF
