name: Zcash Daily Digest → Miro

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum & summarize & post to Miro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
          MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request
          import urllib.error
          import json
          import os
          from datetime import datetime, timezone, date

          ANTHROPIC_API_KEY = os.environ["ANTHROPIC_API_KEY"]
          MIRO_TOKEN        = os.environ["MIRO_TOKEN"]
          MIRO_BOARD_ID     = os.environ["MIRO_BOARD_ID"]

          today = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")

          # ── Step 1: Search Zcash forum via web search ──
          print("Fetching Zcash forum via Claude web search...")

          prompt = f"""Today is {today}.

          Search the Zcash community forum (forum.zcashcommunity.com) and find what has been actively discussed in the last 24 hours. Look at latest threads, active discussions, grant updates, and technical topics.

          Write a concise TL;DR digest formatted as HTML for a Miro sticky note. Use this exact structure:

          <p><strong>📅 {today}</strong></p>

          <p><strong>🔥 TOP THREADS</strong></p>
          <ul>
            <li>[thread title]: [1-2 sentence summary]</li>
            <li>[thread title]: [1-2 sentence summary]</li>
          </ul>

          <p><strong>💬 COMMUNITY PULSE</strong></p>
          <ul>
            <li>[1-2 sentences on overall mood/focus — technical? governance? ecosystem?]</li>
          </ul>

          <p><strong>🔍 WORTH WATCHING</strong></p>
          <ul>
            <li>[thread title] — [brief reason why it matters]</li>
          </ul>

          Return only the HTML. No markdown, no code fences, no extra commentary."""

          messages = [{"role": "user", "content": prompt}]
          tools = [{"type": "web_search_20250305", "name": "web_search"}]
          summary = ""

          for attempt in range(6):
              print(f"  Claude turn {attempt + 1}...")
              payload = json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 2000,
                  "tools": tools,
                  "messages": messages
              }).encode()

              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                      "anthropic-beta": "web-search-2025-03-05",
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req) as res:
                  data = json.loads(res.read())

              messages.append({"role": "assistant", "content": data["content"]})

              if data["stop_reason"] == "end_turn":
                  summary = " ".join(
                      block["text"] for block in data["content"]
                      if block["type"] == "text"
                  ).strip()
                  break

              if data["stop_reason"] == "tool_use":
                  tool_results = [
                      {
                          "type": "tool_result",
                          "tool_use_id": block["id"],
                          "content": block.get("output", "No results.")
                      }
                      for block in data["content"]
                      if block["type"] == "tool_use"
                  ]
                  messages.append({"role": "user", "content": tool_results})
                  continue

              summary = " ".join(
                  block["text"] for block in data["content"]
                  if block["type"] == "text"
              ).strip()
              break

          if not summary:
              raise Exception("No summary returned from Claude.")

          print("Summary generated (truncated):", summary[:80])

          # ── Step 2: Resize frame to ensure it's tall enough ──
          FRAME_ID    = "3458764675063219436"
          CARD_WIDTH  = 600
          CARD_GAP    = 50
          START_Y     = 400
          EPOCH       = date(2026, 6, 10)
          FRAME_HEIGHT = 50000

          print("Resizing frame to ensure enough space...")
          frame_payload = json.dumps({
              "geometry": {"height": FRAME_HEIGHT}
          }).encode()

          frame_req = urllib.request.Request(
              f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/frames/{FRAME_ID}",
              data=frame_payload,
              headers={
                  "Authorization": f"Bearer {MIRO_TOKEN}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="PATCH"
          )
          try:
              with urllib.request.urlopen(frame_req) as res:
                  frame_data = json.loads(res.read())
                  actual_h = frame_data.get("geometry", {}).get("height", "?")
                  print(f"Frame height set to: {actual_h}")
          except urllib.error.HTTPError as e:
              print(f"Frame resize warning {e.code}: {e.read().decode()}")

          # ── Step 3: Calculate card position from date ──
          days_offset = (date.today() - EPOCH).days
          next_y = START_Y + days_offset * (350)
          print(f"Day {days_offset} → card at y={next_y}")

          # ── Step 4: Post card to Miro ──
          miro_payload = json.dumps({
              "data": {
                  "title": f"Zcash Daily Digest — {today}",
                  "description": summary
              },
              "geometry": { "width": CARD_WIDTH },
              "position": { "x": 400, "y": next_y, "origin": "center" },
              "parent": { "id": FRAME_ID }
          }).encode()

          miro_req = urllib.request.Request(
              f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/cards",
              data=miro_payload,
              headers={
                  "Authorization": f"Bearer {MIRO_TOKEN}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(miro_req) as res:
                  result = json.loads(res.read())
                  print(f"✓ Card created: {result.get('id')}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Miro error {e.code}: {body}")
              raise

          print("Done.")
          PYEOF
