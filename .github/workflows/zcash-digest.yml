name: Zcash Daily Digest -> Miro

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum and summarize and post to Miro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
          MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, os, textwrap, base64
          from datetime import datetime, timezone, date

          ANTHROPIC_API_KEY = os.environ["ANTHROPIC_API_KEY"]
          MIRO_TOKEN        = os.environ["MIRO_TOKEN"]
          MIRO_BOARD_ID     = os.environ["MIRO_BOARD_ID"]
          GITHUB_TOKEN      = os.environ["GITHUB_TOKEN"]
          FRAME_ID          = "3458764675294246557"
          EPOCH             = date(2026, 6, 10)
          CARD_WIDTH        = 600
          CARD_STEP         = 80
          START_Y           = 200
          REPO              = "oolu4236/zcash-digest"
          LOG_PATH          = "log.json"
          LOG_BRANCH        = "gh-pages"

          today     = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")
          today_iso = date.today().isoformat()

          print("Fetching Zcash forum...")
          prompt = (
              f"Today is {today}. "
              f"Search the Zcash community forum (forum.zcashcommunity.com) for active discussions since the last digest. "
              f"If today is Monday, cover the entire weekend (Friday through Monday). Otherwise cover the last 24 hours. "
              f"Write the digest in the style of a New York Times editorial briefing - authoritative, engaging, with sharp editorial voice. "
              f"Use vivid language, strong verbs, and opinionated framing that draws readers in. "
              f"Each item should read like a compelling lede, not a dry summary. Think Morning Briefing meets op-ed page. "
              f"Format as HTML. Start with: <h3>The Zcash Brief - {today}</h3> "
              f"<p><em>[One punchy editorial sentence capturing the day theme or mood]</em></p> "
              f"Then sections: <p><strong>THE BIG STORIES</strong></p> with a <ul> of 3-4 items, each as "
              f"<li><a href='[actual forum URL]'><strong>[thread title]</strong></a> - [2-3 editorial sentences. Why this matters. What is at stake.]</li> "
              f"Then: <p><strong>THE PULSE</strong></p> <p>[2-3 sentences reading the room like a columnist]</p> "
              f"Then: <p><strong>WATCH LIST</strong></p> with a <ul> of 1-2 items, same linked format. "
              f"Every thread title MUST be hyperlinked to its actual forum.zcashcommunity.com URL. "
              f"Return only the HTML. No markdown, no code fences."
          )

          messages = [{"role": "user", "content": prompt}]
          tools    = [{"type": "web_search_20250305", "name": "web_search"}]
          summary  = ""

          for attempt in range(6):
              print(f"  Claude turn {attempt + 1}...")
              payload = json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 4000,
                  "tools": tools,
                  "messages": messages
              }).encode()
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                      "anthropic-beta": "web-search-2025-03-05",
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req) as res:
                  data = json.loads(res.read())
              messages.append({"role": "assistant", "content": data["content"]})
              if data["stop_reason"] == "end_turn":
                  summary = " ".join(b["text"] for b in data["content"] if b["type"] == "text").strip()
                  break
              if data["stop_reason"] == "tool_use":
                  messages.append({"role": "user", "content": [
                      {"type": "tool_result", "tool_use_id": b["id"], "content": b.get("output", "")}
                      for b in data["content"] if b["type"] == "tool_use"
                  ]})

          if not summary:
              raise Exception("No summary from Claude.")
          print("Summary ready.")

          days_offset   = (date.today() - EPOCH).days
          next_y        = START_Y + days_offset * CARD_STEP
          needed_height = next_y + 150

          print(f"Day {days_offset} -> y={next_y}, frame height={needed_height}")

          patch = json.dumps({"geometry": {"height": needed_height}}).encode()
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/frames/{FRAME_ID}",
              data=patch,
              headers={"Authorization": f"Bearer {MIRO_TOKEN}",
                       "Content-Type": "application/json",
                       "Accept": "application/json"},
              method="PATCH"
          ))
          print("Frame fitted.")

          card_title = f"The Zcash Brief - {today}"
          card_payload = json.dumps({
              "data": {"title": card_title, "description": summary},
              "geometry": {"width": CARD_WIDTH},
              "position": {"x": 400, "y": next_y, "origin": "center"},
              "parent": {"id": FRAME_ID}
          }).encode()

          miro_card_id = None
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.miro.com/v2/boards/{MIRO_BOARD_ID}/cards",
                  data=card_payload,
                  headers={"Authorization": f"Bearer {MIRO_TOKEN}",
                           "Content-Type": "application/json",
                           "Accept": "application/json"},
                  method="POST"
              )) as res:
                  result = json.loads(res.read())
                  miro_card_id = result.get("id")
                  print(f"Card posted: {miro_card_id}")
          except urllib.error.HTTPError as e:
              print(f"Miro error {e.code}: {e.read().decode()}")
              raise

          print("Updating log.json...")
          gh_api = "https://api.github.com"
          gh_headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          log_sha = None
          log_entries = []
          try:
              req = urllib.request.Request(
                  f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                  headers=gh_headers
              )
              with urllib.request.urlopen(req) as res:
                  file_data = json.loads(res.read())
                  log_sha = file_data["sha"]
                  log_entries = json.loads(base64.b64decode(file_data["content"]))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              print("  log.json not found - will create it.")

          log_entries.append({
              "date": today_iso,
              "title": card_title,
              "content": summary,
              "miro_card_id": miro_card_id,
          })

          put_body = {
              "message": f"digest: {today_iso}",
              "content": base64.b64encode(
                  json.dumps(log_entries, indent=2).encode()
              ).decode(),
              "branch": LOG_BRANCH,
          }
          if log_sha:
              put_body["sha"] = log_sha

          urllib.request.urlopen(urllib.request.Request(
              f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}",
              data=json.dumps(put_body).encode(),
              headers=gh_headers,
              method="PUT"
          ))
          print(f"log.json updated ({len(log_entries)} entries).")

          print("Done.")
          PYEOF
