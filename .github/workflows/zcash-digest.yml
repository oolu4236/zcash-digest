name: Zcash Daily Digest -> Notion

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      custom_content:
        description: 'Optional: paste custom HTML digest content to skip auto-generation'
        required: false
        type: string
      skip_tweet:
        description: 'Skip posting to Twitter/X'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Zcash forum and summarize and post to Notion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_CONTENT: ${{ inputs.custom_content }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SKIP_TWEET: ${{ inputs.skip_tweet }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, os, re, base64
          import hashlib, hmac, time, urllib.parse, secrets as sec
          from datetime import datetime, timezone, date

          # ── Config ─────────────────────────────────────────────
          ANTHROPIC_API_KEY     = os.environ["ANTHROPIC_API_KEY"]
          NOTION_TOKEN          = os.environ["NOTION_TOKEN"]
          NOTION_PAGE_ID        = os.environ["NOTION_PAGE_ID"]
          GITHUB_TOKEN          = os.environ["GITHUB_TOKEN"]
          TWITTER_API_KEY       = os.environ.get("TWITTER_API_KEY", "")
          TWITTER_API_SECRET    = os.environ.get("TWITTER_API_SECRET", "")
          TWITTER_ACCESS_TOKEN  = os.environ.get("TWITTER_ACCESS_TOKEN", "")
          TWITTER_ACCESS_SECRET = os.environ.get("TWITTER_ACCESS_SECRET", "")

          REPO       = "oolu4236/zcash-digest"
          LOG_PATH   = "log.json"
          LOG_BRANCH = "gh-pages"

          today     = datetime.now(timezone.utc).strftime("%A, %B %-d, %Y")
          today_iso = date.today().isoformat()

          # ── Generate or use custom digest ──────────────────────
          custom = os.environ.get("CUSTOM_CONTENT", "").strip()
          if custom:
              summary = custom
              print("Using custom content.")
          else:
              # Fetch last digest to avoid repetition
              print("Fetching last digest for context...")
              last_digest = ""
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                      headers={
                          "Authorization": f"Bearer {GITHUB_TOKEN}",
                          "Accept": "application/vnd.github+json",
                      },
                  )
                  with urllib.request.urlopen(req) as res:
                      file_data = json.loads(res.read())
                      entries = json.loads(base64.b64decode(file_data["content"]))
                      if entries:
                          last_digest = entries[-1].get("content", "")
                          print(f"  Last digest: {entries[-1].get('date', '?')}")
              except Exception as e:
                  print(f"  Could not fetch last digest: {e}")

              # Determine day theme
              weekday = datetime.now(timezone.utc).strftime("%A")
              if weekday == "Monday":
                  day_theme = (
                      "THEME: Weekend recap. Cover Friday through Monday. "
                      "Broader lens — what shifted over the weekend?"
                  )
              elif weekday == "Wednesday":
                  day_theme = (
                      "THEME: Builder spotlight. Pick ONE grant application, tool, or project "
                      "and go deeper on it — why it matters, what's interesting, what questions it raises. "
                      "Do not list multiple projects surface-level."
                  )
              elif weekday == "Friday":
                  day_theme = (
                      "THEME: The week's undercurrent. What is the thing nobody is talking about "
                      "but should be? Step back from the headlines and surface something deeper — "
                      "a pattern, a tension, a question the community is avoiding."
                  )
              else:
                  day_theme = (
                      "THEME: Open. Cover what's genuinely new and interesting. "
                      "If nothing meaningful happened in the last 24 hours, say so in one honest paragraph "
                      "and explore a single question or observation instead. "
                      "A short, thoughtful post beats a long empty one."
                  )

              print(f"Fetching Zcash forum ({weekday})...")
              weekday_name = datetime.now(timezone.utc).strftime("%A")
              prompt = (
                  f"Today is {today}. The day of the week is {weekday_name}. "
                  f"The digest title MUST be: 🛡️ The Zcash Daily — {today}. Do NOT use any other date. "
                  f"\n\n{day_theme}"
                  f"\n\nSOURCES — search broadly, not just the forum: "
                  f"1) forum.zcashcommunity.com for new threads and replies. "
                  f"2) GitHub activity across Zcash repos (zcash, librustzcash, zebra, orchard) — new PRs, merged code, releases. "
                  f"3) Crypto news coverage about Zcash — media articles, regulatory developments. "
                  f"4) X/Twitter posts from core Zcash contributors and developers. "
                  f"5) On-chain signals — shielded pool percentage, transaction volume, hashrate shifts. "
                  f"\n\nNO REPETITION — here is the last digest that was published. "
                  f"Do NOT repeat any thread, topic, stat, or framing from it. "
                  f"If a story was covered before, only mention it if there is a genuinely NEW development "
                  f"(a new milestone, vote result, surprising reply, deadline change). "
                  f"If you cannot find enough fresh material, write a shorter digest — 2-3 paragraphs is fine. "
                  f"Do NOT pad with old stories to fill space."
                  f"\n\n<last_digest>\n{last_digest}\n</last_digest>"
                  f"\n\nVOICE: You are writing as a person thinking out loud — not a news anchor, not an LLM summary. "
                  f"Write like someone way-finding through the Zcash ecosystem publicly — curious, honest, willing to say 'I don't know'. "
                  f"Surface things people might not be paying attention to. Ask real questions. Have a take, even if tentative. "
                  f"COMMUNITY VOICES: If you find a forum reply that's sharp or surprising, quote the person directly. "
                  f"Surface the human, not just the thread. People engage when they see themselves reflected. "
                  f"COMMENTARY OVER COVERAGE: On slow days, explore one question honestly rather than listing headlines. "
                  f"e.g. 'Why does the NU7 vote matter if no ZIP makes it binding?' — that's the content that gets shared. "
                  f"\n\nLINKS — HARD REQUIREMENT: "
                  f"Every paragraph MUST contain at least 2 inline hyperlinks using <a href='URL'>anchor text</a>. "
                  f"A paragraph with zero links is INVALID and will be rejected. "
                  f"Link to the actual source: forum thread URL, news article URL, GitHub PR URL, tweet URL. "
                  f"Use the real URLs you found during web search — do NOT use placeholder or generic URLs. "
                  f"Example: <a href='https://forum.zcashcommunity.com/t/nu7-timeline/57655'>NU7 timeline</a>. "
                  f"\n\nFORMAT: flowing paragraphs, no rigid sections. "
                  f"Each paragraph focuses on one thread or theme, with sources hyperlinked inline. "
                  f"Use emoticons sparingly where they add warmth (🛡️ 🗳️ 📣). "
                  f"Keep it tight — 3 paragraphs max, 4 only if the day genuinely warrants it. "
                  f"STRICT: Each paragraph must be 3-4 sentences and under 400 characters. "
                  f"If you cannot say it in 4 sentences, you are covering too much — pick fewer topics and say less about each. "
                  f"The entire digest (excluding CTA) must be under 1200 characters total. Scannable in 60 seconds. No filler, no hedging, no preamble. "
                  f"Do NOT start with 'Based on search results' or any meta-commentary. Jump straight into the HTML. "
                  f"\n\nHTML structure with <br> between paragraphs: "
                  f"<h3>🛡️ The Zcash Daily — {today}</h3><br> "
                  f"[paragraphs in <p> tags separated by <br>] "
                  f"End with: <br><p><em>📣 Never miss a digest — click the 🔔 notification bell on the right to get alerted when a new one drops. "
                  f"And follow us on X: <a href='https://x.com/thezcashdaily'>@thezcashdaily</a></em></p> "
                  f"\n\nReturn ONLY the HTML. No markdown, no code fences."
              )

              messages = [{"role": "user", "content": prompt}]
              tools = [{"type": "web_search_20250305", "name": "web_search"}]
              summary = ""

              for attempt in range(6):
                  print(f"  Claude turn {attempt + 1}...")
                  payload = json.dumps({
                      "model": "claude-sonnet-4-6",
                      "max_tokens": 4000,
                      "tools": tools,
                      "messages": messages,
                  }).encode()
                  req = urllib.request.Request(
                      "https://api.anthropic.com/v1/messages",
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "x-api-key": ANTHROPIC_API_KEY,
                          "anthropic-version": "2023-06-01",
                          "anthropic-beta": "web-search-2025-03-05",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req) as res:
                          data = json.loads(res.read())
                  except urllib.error.HTTPError as api_err:
                      print(f"Claude API error {api_err.code}: {api_err.read().decode()}")
                      raise
                  messages.append({"role": "assistant", "content": data["content"]})
                  if data["stop_reason"] == "end_turn":
                      summary = " ".join(
                          b["text"] for b in data["content"] if b["type"] == "text"
                      ).strip()
                      break
                  if data["stop_reason"] == "tool_use":
                      messages.append({"role": "user", "content": [
                          {"type": "tool_result", "tool_use_id": b["id"], "content": b.get("output", "")}
                          for b in data["content"] if b["type"] == "tool_use"
                      ]})

          if not summary:
              raise Exception("No summary from Claude.")
          print("Summary ready.")

          # ── Fact-check claims ────────────────────────────────
          print("Fact-checking claims...")
          fc_prompt = (
              f"You are a fact-checker for a Zcash daily digest. "
              f"Read the digest below and identify every factual claim — numbers, dates, prices, "
              f"names, titles, percentages, events, attributions. "
              f"Use web search to verify each claim against primary sources. "
              f"\n\nFor each claim, report: "
              f"- ✅ VERIFIED: [claim] — [source] "
              f"- ❌ WRONG: [claim] — actual fact is [X] — [source] "
              f"- ⚠️ UNVERIFIABLE: [claim] — could not find a primary source "
              f"\n\nAfter the checklist, if any claims are WRONG, output a corrected version of the "
              f"full digest HTML with fixes applied. If all claims check out, output ONLY the word PASS. "
              f"\n\nDo NOT change voice, structure, or add new content — only fix factual errors. "
              f"\n\n<digest>\n{summary}\n</digest>"
          )

          fc_messages = [{"role": "user", "content": fc_prompt}]
          fc_summary = ""

          for fc_attempt in range(6):
              print(f"  Fact-check turn {fc_attempt + 1}...")
              fc_payload = json.dumps({
                  "model": "claude-sonnet-4-6",
                  "max_tokens": 6000,
                  "tools": tools,
                  "messages": fc_messages,
              }).encode()
              fc_req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=fc_payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                      "anthropic-beta": "web-search-2025-03-05",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(fc_req) as res:
                      fc_data = json.loads(res.read())
              except urllib.error.HTTPError as fc_err:
                  print(f"  Fact-check API error {fc_err.code}: {fc_err.read().decode()}")
                  break
              fc_messages.append({"role": "assistant", "content": fc_data["content"]})
              if fc_data["stop_reason"] == "end_turn":
                  fc_summary = " ".join(
                      b["text"] for b in fc_data["content"] if b["type"] == "text"
                  ).strip()
                  break
              if fc_data["stop_reason"] == "tool_use":
                  fc_messages.append({"role": "user", "content": [
                      {"type": "tool_result", "tool_use_id": b["id"], "content": b.get("output", "")}
                      for b in fc_data["content"] if b["type"] == "tool_use"
                  ]})

          if fc_summary:
              if "PASS" in fc_summary and len(fc_summary) < 20:
                  print("  All facts verified ✅")
              elif "❌" in fc_summary:
                  # Extract corrected HTML from fact-check response
                  corrected = re.search(r'<h3>.*</p>\s*$', fc_summary, re.DOTALL)
                  if corrected:
                      summary = corrected.group(0).strip()
                      print("  Facts corrected and digest updated ✏️")
                  else:
                      print("  ❌ found but could not extract corrected HTML — using original")
                  # Print the full fact-check report
                  for line in fc_summary.split("\n"):
                      if line.strip().startswith(("✅", "❌", "⚠️")):
                          print(f"  {line.strip()}")
              else:
                  print("  Fact-check completed (no errors flagged)")
          else:
              print("  Fact-check skipped (no response)")

          # ── Verify all links ───────────────────────────────────
          print("Verifying links...")
          urls = re.findall(r'href=["\']([^"\']+)["\']', summary)
          broken = []
          for url in urls:
              if url.startswith("mailto:") or url.startswith("#"):
                  continue
              try:
                  check_req = urllib.request.Request(url, method="HEAD")
                  check_req.add_header("User-Agent", "Mozilla/5.0 (compatible; ZcashDigestBot/1.0)")
                  with urllib.request.urlopen(check_req, timeout=10) as resp:
                      if resp.status >= 400:
                          broken.append((url, resp.status))
                      else:
                          print(f"  ✓ {url}")
              except urllib.error.HTTPError as e:
                  if e.code in (403, 429):
                      print(f"  ~ {url} ({e.code} — bot-blocked, keeping link)")
                  elif e.code == 405:
                      try:
                          get_req = urllib.request.Request(url, method="GET")
                          get_req.add_header("User-Agent", "Mozilla/5.0 (compatible; ZcashDigestBot/1.0)")
                          with urllib.request.urlopen(get_req, timeout=10) as resp:
                              if resp.status >= 400:
                                  broken.append((url, resp.status))
                              else:
                                  print(f"  ✓ {url} (GET fallback)")
                      except Exception as e2:
                          broken.append((url, str(e2)))
                  else:
                      broken.append((url, e.code))
              except Exception as e:
                  broken.append((url, str(e)))

          if broken:
              print(f"⚠️  Found {len(broken)} broken link(s):")
              for url, status in broken:
                  print(f"  ✗ {url} -> {status}")
              for url, _ in broken:
                  summary = re.sub(
                      rf'<a\s+href=["\']' + re.escape(url) + r'["\'][^>]*>(.*?)</a>',
                      r'\1',
                      summary,
                  )
              print("Broken links stripped from digest (text preserved).")
          else:
              print(f"All {len(urls)} links verified ✓")

          # ── Post to Notion ──────────────────────────────────────
          card_title = f"The Zcash Daily - {today}"
          notion_page_id = None

          # Convert HTML to Notion blocks
          def html_to_notion_blocks(html):
              """Convert digest HTML to Notion block children."""
              blocks = []
              # Extract paragraphs
              paragraphs = re.findall(r'<p>(.*?)</p>', html, re.DOTALL)
              for p in paragraphs:
                  # Convert <a href="...">text</a> to Notion rich text with links
                  rich_text = []
                  pos = 0
                  for m in re.finditer(r'<a\s+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', p):
                      # Text before link
                      before = re.sub(r'<[^>]+>', '', p[pos:m.start()])
                      if before:
                          rich_text.append({"type": "text", "text": {"content": before}})
                      # Link
                      link_text = re.sub(r'<[^>]+>', '', m.group(2))
                      rich_text.append({
                          "type": "text",
                          "text": {"content": link_text, "link": {"url": m.group(1)}},
                          "annotations": {"bold": False, "italic": False, "underline": True},
                      })
                      pos = m.end()
                  # Remaining text after last link
                  after = re.sub(r'<[^>]+>', '', p[pos:])
                  if after:
                      rich_text.append({"type": "text", "text": {"content": after}})
                  if rich_text:
                      blocks.append({
                          "object": "block",
                          "type": "paragraph",
                          "paragraph": {"rich_text": rich_text},
                      })
              return blocks

          # Extract title from h3 if present
          h3_match = re.search(r'<h3>(.*?)</h3>', summary)
          page_title = re.sub(r'<[^>]+>', '', h3_match.group(1)) if h3_match else card_title

          blocks = html_to_notion_blocks(summary)

          notion_payload = json.dumps({
              "parent": {"page_id": NOTION_PAGE_ID},
              "properties": {
                  "title": [{"text": {"content": page_title}}],
              },
              "children": blocks,
          }).encode()

          try:
              with urllib.request.urlopen(urllib.request.Request(
                  "https://api.notion.com/v1/pages",
                  data=notion_payload,
                  headers={
                      "Authorization": f"Bearer {NOTION_TOKEN}",
                      "Content-Type": "application/json",
                      "Notion-Version": "2022-06-28",
                  },
                  method="POST",
              )) as res:
                  result = json.loads(res.read())
                  notion_page_id = result.get("id")
                  print(f"Notion page created: {notion_page_id}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Notion error ({e.code}): {body}")

          # ── Update log.json ────────────────────────────────────
          print("Updating log.json...")
          gh_api = "https://api.github.com"
          gh_headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          log_sha = None
          log_entries = []
          try:
              req = urllib.request.Request(
                  f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}?ref={LOG_BRANCH}",
                  headers=gh_headers,
              )
              with urllib.request.urlopen(req) as res:
                  file_data = json.loads(res.read())
                  log_sha = file_data["sha"]
                  log_entries = json.loads(base64.b64decode(file_data["content"]))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              print("  log.json not found - will create it.")

          log_entries.append({
              "date": today_iso,
              "title": card_title,
              "content": summary,
              "notion_page_id": notion_page_id,
          })

          put_body = {
              "message": f"digest: {today_iso}",
              "content": base64.b64encode(
                  json.dumps(log_entries, indent=2).encode()
              ).decode(),
              "branch": LOG_BRANCH,
          }
          if log_sha:
              put_body["sha"] = log_sha

          urllib.request.urlopen(urllib.request.Request(
              f"{gh_api}/repos/{REPO}/contents/{LOG_PATH}",
              data=json.dumps(put_body).encode(),
              headers=gh_headers,
              method="PUT",
          ))
          print(f"log.json updated ({len(log_entries)} entries).")

          # ── Post to Twitter/X ──────────────────────────────────
          skip_tweet = os.environ.get("SKIP_TWEET", "").lower() in ("true", "1", "yes")
          if TWITTER_API_KEY and TWITTER_ACCESS_TOKEN and not skip_tweet:
              print("Generating tweet...")
              forum_url = "https://forum.zcashcommunity.com/t/the-zcash-daily/57219"
              tweet_prompt = (
                  f"Condense this HTML digest into tweet text (max 200 chars — URL and CTA are added separately). "
                  f"Write it as a voiced, human take — not a bullet-point summary. "
                  f"Use \\n\\n (double newline) between distinct thoughts so Twitter renders line breaks. "
                  f"Tag people and orgs mentioned (e.g. @matthuang, @ElectricCoinCo, @ZcashFoundation). "
                  f"Include #Zcash hashtag. Sharp and editorial. "
                  f"Do NOT include any URL or CTA in your output — just the voiced text with tags and hashtag. "
                  f"CRITICAL: The output MUST contain literal newline characters (\\n\\n) between paragraphs, not spaces.\n\n{summary}"
              )
              tweet_payload = json.dumps({
                  "model": "claude-haiku-4-5-20251001",
                  "max_tokens": 300,
                  "messages": [{"role": "user", "content": tweet_prompt}],
              }).encode()
              tweet_req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=tweet_payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": ANTHROPIC_API_KEY,
                      "anthropic-version": "2023-06-01",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(tweet_req) as res:
                  tweet_data = json.loads(res.read())
              tweet_text = tweet_data["content"][0]["text"].strip()
              cta = "Read more 👇"
              tail = f"\n\n{cta}\n{forum_url}"
              max_text = 280 - len(tail)
              if len(tweet_text) > max_text:
                  tweet_text = tweet_text[:max_text - 3] + "..."
              tweet_text = f"{tweet_text}{tail}"
              print(f"Tweet ({len(tweet_text)} chars): {tweet_text}")

              # OAuth 1.0a signature
              def oauth_sign(method, url, params):
                  base = "&".join([
                      method.upper(),
                      urllib.parse.quote(url, safe=""),
                      urllib.parse.quote("&".join(
                          f"{urllib.parse.quote(k, safe='')}={urllib.parse.quote(v, safe='')}"
                          for k, v in sorted(params.items())
                      ), safe=""),
                  ])
                  key = (
                      f"{urllib.parse.quote(TWITTER_API_SECRET, safe='')}"
                      f"&{urllib.parse.quote(TWITTER_ACCESS_SECRET, safe='')}"
                  )
                  return base64.b64encode(
                      hmac.new(key.encode(), base.encode(), hashlib.sha1).digest()
                  ).decode()

              tw_url = "https://api.x.com/2/tweets"
              oauth_params = {
                  "oauth_consumer_key": TWITTER_API_KEY,
                  "oauth_nonce": sec.token_hex(16),
                  "oauth_signature_method": "HMAC-SHA1",
                  "oauth_timestamp": str(int(time.time())),
                  "oauth_token": TWITTER_ACCESS_TOKEN,
                  "oauth_version": "1.0",
              }
              oauth_params["oauth_signature"] = oauth_sign("POST", tw_url, oauth_params)
              auth_header = "OAuth " + ", ".join(
                  f'{urllib.parse.quote(k, safe="")}="{urllib.parse.quote(v, safe="")}"'
                  for k, v in sorted(oauth_params.items())
              )

              tw_payload = json.dumps({"text": tweet_text}).encode()
              tw_req = urllib.request.Request(
                  tw_url,
                  data=tw_payload,
                  headers={
                      "Authorization": auth_header,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(tw_req) as res:
                      tw_result = json.loads(res.read())
                      print(f"Tweet posted: {tw_result['data']['id']}")
              except urllib.error.HTTPError as e:
                  print(f"Twitter error {e.code}: {e.read().decode()}")
          else:
              print("Twitter credentials not set, skipping tweet.")

          print("Done.")
          PYEOF
