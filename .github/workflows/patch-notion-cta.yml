name: Patch Notion CTA with UA tip address

on:
  workflow_dispatch:

jobs:
  patch-cta:
    runs-on: ubuntu-latest
    steps:
      - name: Append UA tip jar to today's Notion digest page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json

          NOTION_TOKEN = "${{ secrets.NOTION_TOKEN }}"
          PAGE_ID = "40f4c3d2-84a7-81b7-8d19-cfe22e747f07"
          UA = "u1ugdhhhag775002dh5yx58mw6nlvr9k2zd2lqg8nvtudgxxmntwtavkp3ushc04t0ejynf0j6rt9h4xgcumwve4dkgkq6rlcju5vcq8g2"

          headers = {
              "Authorization": f"Bearer {NOTION_TOKEN}",
              "Content-Type": "application/json",
              "Notion-Version": "2022-06-28",
          }

          # Fetch existing blocks to find the CTA paragraph
          print("Fetching page blocks...")
          req = urllib.request.Request(
              f"https://api.notion.com/v1/blocks/{PAGE_ID}/children?page_size=100",
              headers=headers,
          )
          with urllib.request.urlopen(req) as res:
              data = json.loads(res.read())

          blocks = data.get("results", [])
          print(f"Found {len(blocks)} blocks")

          # Find the CTA block (contains "Never miss a digest")
          cta_block_id = None
          for b in blocks:
              if b["type"] == "paragraph":
                  texts = b["paragraph"].get("rich_text", [])
                  full_text = "".join(t.get("plain_text", "") for t in texts)
                  if "Never miss a digest" in full_text:
                      cta_block_id = b["id"]
                      print(f"Found CTA block: {cta_block_id}")
                      print(f"  Text: {full_text[:80]}...")
                      break

          if not cta_block_id:
              print("CTA block not found — appending tip jar as new block")
              # Append as a new paragraph at the end
              append_payload = json.dumps({
                  "children": [{
                      "object": "block",
                      "type": "paragraph",
                      "paragraph": {
                          "rich_text": [
                              {"type": "text", "text": {"content": "🛡️ Tip the digest (shielded): "}},
                              {"type": "text", "text": {"content": UA}, "annotations": {"code": True}},
                          ]
                      }
                  }]
              }).encode()
              req = urllib.request.Request(
                  f"https://api.notion.com/v1/blocks/{PAGE_ID}/children",
                  data=append_payload,
                  headers=headers,
                  method="PATCH",
              )
              with urllib.request.urlopen(req) as res:
                  print("Tip jar appended as new block ✓")
          else:
              # Update the existing CTA block to include the UA tip line
              update_payload = json.dumps({
                  "paragraph": {
                      "rich_text": [
                          {
                              "type": "text",
                              "text": {"content": "📣 Never miss a digest — click the 🔔 notification bell on the right to get alerted when a new one drops. And follow us on X: "},
                              "annotations": {"italic": True},
                          },
                          {
                              "type": "text",
                              "text": {"content": "@thezcashdaily", "link": {"url": "https://x.com/thezcashdaily"}},
                              "annotations": {"italic": True, "underline": True},
                          },
                          {
                              "type": "text",
                              "text": {"content": "\n🛡️ Tip the digest (shielded): "},
                              "annotations": {"italic": True},
                          },
                          {
                              "type": "text",
                              "text": {"content": UA},
                              "annotations": {"italic": True, "code": True},
                          },
                      ]
                  }
              }).encode()
              req = urllib.request.Request(
                  f"https://api.notion.com/v1/blocks/{cta_block_id}",
                  data=update_payload,
                  headers=headers,
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      print("CTA block updated with UA tip address ✓")
              except urllib.error.HTTPError as e:
                  print(f"Update failed ({e.code}): {e.read().decode()}")
                  raise

          print("Done.")
          PYEOF
