<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zcash Forum TL;DR</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F4B728;
    --bg: #0F0F0F;
    --surface: #181818;
    --surface2: #222222;
    --border: #2E2E2E;
    --text: #E8E8E0;
    --muted: #888880;
    --green: #4ADE80;
    --red: #F87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
    font-size: 13px;
  }
  .header { margin-bottom: 16px; }
  .wordmark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 3px;
  }
  .title {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -.02em;
    color: var(--text);
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
  }
  .fetch-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin: 14px 0 12px;
    transition: opacity .15s;
  }
  .fetch-btn:hover { opacity: .88; }
  .fetch-btn:disabled { opacity: .4; cursor: not-allowed; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    margin-bottom: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-height: 36px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  .status-dot.active { background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  .status-dot.done   { background: var(--green); animation: none; }
  .status-dot.error  { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #5A4A0E;
    margin-bottom: 8px;
  }

  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    font-weight: 300;
    white-space: pre-wrap;
    margin-bottom: 12px;
    min-height: 60px;
  }
  .summary-box.empty { color: var(--muted); font-style: italic; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    transition: border-color .12s;
  }
  .action-btn:hover { border-color: #555; }
  .action-btn:disabled { opacity: .35; cursor: not-allowed; }
  .action-btn.primary {
    background: #1a2a1a;
    border-color: #2d5c2d;
    color: var(--green);
  }
  .action-btn.primary:hover { border-color: #3a7a3a; }

  .timestamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="wordmark">Zcash Community</div>
  <div class="title">Forum TL;DR</div>
  <div class="subtitle">Last 24h · forum.zcashcommunity.com</div>
</div>

<button class="fetch-btn" id="main-btn" onclick="runPipeline()">
  ⚡ Fetch &amp; Summarize
</button>

<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">Ready — hit the button to fetch today's activity.</span>
</div>

<div class="section-label">TL;DR digest</div>
<div class="summary-box empty" id="summary-box">Summary will appear here after fetching.</div>

<div class="actions">
  <button class="action-btn primary" id="miro-btn" disabled onclick="postToMiro()">
    📌 Drop on board
  </button>
  <button class="action-btn" id="copy-btn" disabled onclick="copyText()">
    📋 Copy
  </button>
</div>

<div class="timestamp" id="timestamp"></div>

<script>
let summaryText = "";

function setStatus(state, msg) {
  const dot = document.getElementById("status-dot");
  dot.className = "status-dot " + (state === "loading" ? "active" : state === "done" ? "done" : state === "error" ? "error" : "");
  document.getElementById("status-text").textContent = msg;
}

async function runPipeline() {
  const btn = document.getElementById("main-btn");
  btn.disabled = true;
  document.getElementById("miro-btn").disabled = true;
  document.getElementById("copy-btn").disabled = true;
  summaryText = "";
  const box = document.getElementById("summary-box");
  box.className = "summary-box empty";
  box.textContent = "Fetching…";

  try {
    const today = new Date().toLocaleDateString("en-US", { weekday:"long", year:"numeric", month:"long", day:"numeric" });

    const prompt = `Today is ${today}.

Search the Zcash community forum (forum.zcashcommunity.com) and find what has been actively discussed recently — focus on the last 24-48 hours. Look at latest threads, active discussions, grant updates, and technical topics.

Then write a concise TL;DR digest for a team Miro board sticky note. Format exactly like this:

📅 ${today}

🔥 TOP THREADS
• [2-3 sentence summary of what's being discussed, grouping related threads]

💬 COMMUNITY PULSE
• [1-2 sentences on overall mood/focus — technical? governance? ecosystem?]

🔍 WORTH WATCHING
• [1-2 specific threads worth a closer look, with brief reason why]

Keep it tight and factual. No filler. The whole digest must fit on one sticky note.`;

    const messages = [{ role: "user", content: prompt }];
    const tools = [{ type: "web_search_20250305", name: "web_search" }];
    let attempts = 0;

    while (attempts < 6) {
      attempts++;
      setStatus("loading", `Searching forum… (turn ${attempts})`);

      const apiRes = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 2000, tools, messages })
      });

      if (!apiRes.ok) {
        const err = await apiRes.json().catch(() => ({}));
        throw new Error("Claude API error: " + (err.error?.message || apiRes.status));
      }

      const data = await apiRes.json();
      messages.push({ role: "assistant", content: data.content });

      if (data.stop_reason === "end_turn") {
        summaryText = data.content.filter(c => c.type === "text").map(c => c.text).join("\n").trim();
        break;
      }

      if (data.stop_reason === "tool_use") {
        const results = data.content.filter(c => c.type === "tool_use").map(c => ({
          type: "tool_result",
          tool_use_id: c.id,
          content: c.output || "No results."
        }));
        messages.push({ role: "user", content: results });
        continue;
      }

      summaryText = data.content.filter(c => c.type === "text").map(c => c.text).join("\n").trim();
      break;
    }

    if (!summaryText) throw new Error("No summary returned.");

    box.className = "summary-box";
    box.textContent = summaryText;
    setStatus("done", "Done — ready to drop on board.");
    document.getElementById("miro-btn").disabled = false;
    document.getElementById("copy-btn").disabled = false;
    document.getElementById("timestamp").textContent = "Generated " + new Date().toLocaleString();

  } catch(err) {
    setStatus("error", "Error: " + err.message);
    box.className = "summary-box empty";
    box.textContent = "Something went wrong. Try again.";
  }
  btn.disabled = false;
}

function copyText() {
  if (!summaryText) return;
  navigator.clipboard.writeText(summaryText).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ Copied";
    setTimeout(() => btn.textContent = "📋 Copy", 2000);
  });
}

async function postToMiro() {
  if (!summaryText) return;
  const btn = document.getElementById("miro-btn");
  btn.disabled = true;
  btn.textContent = "⏳ Dropping…";
  setStatus("loading", "Placing sticky note on board…");

  try {
    // Use Miro Web SDK to create sticky note at center of current viewport
    await miro.board.createStickyNote({
      content: summaryText,
      shape: "rectangle",
      style: {
        fillColor: "yellow",
        textAlign: "left",
        fontSize: 14,
      },
      x: 0,
      y: 0,
      width: 480,
    });

    await miro.board.ui.closePanel();
    setStatus("done", "✓ Sticky note placed on board!");
    btn.textContent = "✓ Done";

  } catch(err) {
    setStatus("error", "Miro error: " + err.message);
    btn.disabled = false;
    btn.textContent = "📌 Drop on board";
  }
}
</script>
</body>
</html>
